<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Farmkogls Booking Console">
<title>Farmkogls Booking Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9A%A2%3C/text%3E%3C/svg%3E">
<style id="gate-css">
/* ============================================================================
   PIN gate — extends the console's existing token system rather than replacing
   it. The field behind the card stays deep-hull navy in both themes (a berth at
   dusk); the card and the console itself follow the viewer's theme.
   ========================================================================= */
#gate {
  --g-hull:  #0a1420;
  --g-sea:   #15273c;
  --g-card:  #ffffff;
  --g-ink:   #101822;
  --g-ink-2: #55616f;
  --g-ink-3: #8b96a3;
  --g-line:  #dde4ec;
  --g-slot:  #eef2f7;
  --g-signal:#2f6fd0;
  --g-bad:   #c0392b;
  --g-csc:   #3c6fd1;
  --g-nwx:   #17997a;
  --g-ccs:   #c98a05;
  --g-sks:   #d9642a;

  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 24px 18px;
  overflow: auto;
  background:
    radial-gradient(120% 90% at 50% 8%, var(--g-sea) 0%, var(--g-hull) 62%, #060d16 100%);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  #gate {
    --g-card:  #161d27;
    --g-ink:   #e7edf5;
    --g-ink-2: #a3aeba;
    --g-ink-3: #78838f;
    --g-line:  #2b3441;
    --g-slot:  #1e2732;
    --g-signal:#6ba3f5;
  }
}
:root[data-theme="dark"] #gate {
  --g-card: #161d27; --g-ink: #e7edf5; --g-ink-2: #a3aeba; --g-ink-3: #78838f;
  --g-line: #2b3441; --g-slot: #1e2732; --g-signal: #6ba3f5;
}
:root[data-theme="light"] #gate {
  --g-card: #ffffff; --g-ink: #101822; --g-ink-2: #55616f; --g-ink-3: #8b96a3;
  --g-line: #dde4ec; --g-slot: #eef2f7; --g-signal: #2f6fd0;
}

#gate[hidden] { display: none; }

/* ---- the port-rotation line behind the card ---------------------------- */
.gate-field {
  position: absolute;
  inset: auto 0 0 0;
  height: min(46vh, 320px);
  color: rgba(140, 190, 235, .17);
  pointer-events: none;
}
.gate-rot { width: 100%; height: 100%; display: block; }
.gate-calls circle { fill: rgba(160, 205, 245, .32); }

/* ---- card -------------------------------------------------------------- */
.gate-card {
  position: relative;
  width: 100%;
  max-width: 424px;
  background: var(--g-card);
  color: var(--g-ink);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  overflow: hidden;
}

/* the four service loops, in their own colours — this is the fleet, not trim */
.gate-loops { display: flex; height: 3px; }
.gate-loops i { flex: 1; display: block; }
.gate-loops i[data-svc="CSC"] { background: var(--g-csc); }
.gate-loops i[data-svc="NWX"] { background: var(--g-nwx); }
.gate-loops i[data-svc="CCS"] { background: var(--g-ccs); }
.gate-loops i[data-svc="SKS"] { background: var(--g-sks); }

.gate-head { padding: 26px 26px 4px; }
.gate-eyebrow {
  margin: 0 0 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--g-ink-3);
}
#gate h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -.02em;
  text-wrap: balance;
  color: var(--g-ink);
}
.gate-sub {
  margin: 9px 0 0;
  font-size: 13px;
  line-height: 1.55;
  color: var(--g-ink-2);
  max-width: 34ch;
}
.gate-sub span {
  display: block;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .05em;
  color: var(--g-ink-3);
}

/* ---- pin --------------------------------------------------------------- */
.gate-form { padding: 20px 26px 4px; }
.gate-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--g-ink-3);
  margin-bottom: 9px;
}
.gate-cells { display: flex; gap: 10px; }
.gate-cells .cell {
  flex: 1;
  aspect-ratio: 4 / 5;
  max-height: 76px;
  display: grid;
  place-items: center;
  background: var(--g-slot);
  border: 1px solid var(--g-line);
  border-radius: 9px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  font-weight: 600;
  color: var(--g-ink);
  transition: border-color .14s, background .14s, transform .14s;
}
.gate-cells .cell.filled { border-color: var(--g-signal); background: var(--g-card); }
.gate-cells .cell.pop { animation: gate-pop .16s ease-out; }
.gate-cells .cell.active {
  border-color: var(--g-signal);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--g-signal) 22%, transparent);
}
@keyframes gate-pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }

#gate.bad .gate-cells { animation: gate-shake .34s; }
#gate.bad .gate-cells .cell { border-color: var(--g-bad); }
@keyframes gate-shake {
  0%,100% { transform: translateX(0); }
  18% { transform: translateX(-7px); } 38% { transform: translateX(6px); }
  58% { transform: translateX(-4px); } 78% { transform: translateX(2px); }
}

/* keeps the mobile keyboard reachable without showing a second field */
.gate-proxy {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  border: 0; padding: 0;
  left: 26px; top: 50%;
}
.gate-proxy:focus { outline: none; }
.gate-proxy:focus-visible + .gate-msg { color: var(--g-ink-2); }

.gate-msg {
  margin: 12px 0 0;
  min-height: 1.4em;
  font-size: 12.5px;
  color: var(--g-ink-3);
}
#gate.bad .gate-msg { color: var(--g-bad); font-weight: 500; }
#gate.ok .gate-msg { color: #1f8a5b; font-weight: 500; }

/* ---- keypad ------------------------------------------------------------ */
.gate-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
}
.gate-pad button {
  appearance: none;
  padding: 13px 0;
  border: 1px solid var(--g-line);
  border-radius: 9px;
  background: var(--g-card);
  color: var(--g-ink);
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 17px;
  font-weight: 550;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .08s;
}
.gate-pad button.wide { font-family: var(--sans); font-size: 13px; font-weight: 500; }
.gate-pad button:hover { background: var(--g-slot); border-color: var(--g-ink-3); }
.gate-pad button:active { transform: translateY(1px); }
.gate-pad button:focus-visible {
  outline: 2px solid var(--g-signal);
  outline-offset: 2px;
}

/* ---- footer ------------------------------------------------------------ */
.gate-foot {
  margin-top: 18px;
  padding: 15px 26px 22px;
  border-top: 1px solid var(--g-line);
}
.gate-foot p { margin: 0; font-size: 12px; line-height: 1.55; color: var(--g-ink-2); }
.gate-caveat { margin-top: 8px !important; color: var(--g-ink-3) !important; font-size: 11.5px !important; }
.gate-caveat b { color: var(--g-ink-2); font-weight: 600; }

/* ---- unlock transition ------------------------------------------------- */
#gate.leaving { animation: gate-out .34s ease-in forwards; }
@keyframes gate-out { to { opacity: 0; transform: scale(1.015); } }

/* ---- hosted-only chrome inside the console ----------------------------- */
.hosted-btn { margin-left: 0; }
#lockBtn { border-color: rgba(255, 255, 255, .28); }

@media (max-width: 420px) {
  .gate-head { padding: 22px 18px 4px; }
  .gate-form { padding: 18px 18px 4px; }
  .gate-foot { padding: 14px 18px 20px; }
  #gate h1 { font-size: 22px; }
  .gate-cells .cell { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  #gate *, #gate { animation: none !important; transition: none !important; }
}

</style>
<style id="tool-css">
/* ============================================================================
   Farmkogls Booking Console — styles
   Light by default, dark when the OS asks for it. Data density over decoration.
   ========================================================================= */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --surface-3: #e3e8ef;
  --ink: #1a1f2b;
  --ink-2: #59616f;
  --ink-3: #8a919e;
  --line: #d8dee7;
  --line-2: #eaeef3;
  --brand: #1f3864;
  --brand-ink: #ffffff;
  --accent: #2f6fd0;
  --pos: #1f8a5b;
  --pos-bg: #e6f4ec;
  --neg: #c0392b;
  --neg-bg: #fdeceb;
  --warn: #a86400;
  --warn-bg: #fdf3e0;
  --csc: #3c6fd1;
  --nwx: #17997a;
  --ccs: #c98a05;
  --sks: #d9642a;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --radius: 8px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --sans: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d;
    --surface: #1b1f27;
    --surface-2: #232833;
    --surface-3: #2c323f;
    --ink: #e7ecf3;
    --ink-2: #a8b2c1;
    --ink-3: #798393;
    --line: #333a47;
    --line-2: #262c37;
    --brand: #2b4a7d;
    --accent: #6ba3f5;
    --pos: #4cc38a;
    --pos-bg: #16301f;
    --neg: #f27a6e;
    --neg-bg: #33191a;
    --warn: #e3ab3c;
    --warn-bg: #332714;
    --csc: #6f9df3;
    --nwx: #47cfa8;
    --ccs: #e8bd4b;
    --sks: #f59a63;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1b1f27; --surface-2: #232833; --surface-3: #2c323f;
  --ink: #e7ecf3; --ink-2: #a8b2c1; --ink-3: #798393; --line: #333a47; --line-2: #262c37;
  --brand: #2b4a7d; --accent: #6ba3f5; --pos: #4cc38a; --pos-bg: #16301f;
  --neg: #f27a6e; --neg-bg: #33191a; --warn: #e3ab3c; --warn-bg: #332714;
  --csc: #6f9df3; --nwx: #47cfa8; --ccs: #e8bd4b; --sks: #f59a63;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
:root[data-theme="light"] {
  --bg: #f6f7f9; --surface: #fff; --surface-2: #eef1f5; --surface-3: #e3e8ef;
  --ink: #1a1f2b; --ink-2: #59616f; --ink-3: #8a919e; --line: #d8dee7; --line-2: #eaeef3;
  --brand: #1f3864; --accent: #2f6fd0; --pos: #1f8a5b; --pos-bg: #e6f4ec;
  --neg: #c0392b; --neg-bg: #fdeceb; --warn: #a86400; --warn-bg: #fdf3e0;
  --csc: #3c6fd1; --nwx: #17997a; --ccs: #c98a05; --sks: #d9642a;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
a { color: var(--accent); }
code, .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 20px 64px; }

header.top {
  position: sticky; top: 0; z-index: 40;
  background: var(--brand); color: #fff;
  border-bottom: 1px solid rgba(0, 0, 0, .2);
}
.top-in {
  max-width: 1680px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.logo { display: flex; align-items: baseline; gap: 9px; }
.logo b { font-size: 16px; letter-spacing: -.02em; }
.logo span { font-size: 11.5px; opacity: .72; }
.top .stat { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.top .stat div { line-height: 1.25; }
.top .stat u { display: block; font: 10px/1.4 var(--sans); text-transform: uppercase;
  letter-spacing: .07em; opacity: .66; text-decoration: none; }
.top .stat b { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 7px 13px; border-radius: 6px; font: 500 13px var(--sans);
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; border-color: rgba(255, 255, 255, .28); color: #fff; }
.btn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .12); border-color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.danger { color: var(--neg); border-color: var(--neg); background: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--neg-bg); }

/* ---------- drop zone ---------- */
.drop {
  margin: 18px 0; padding: 26px; border: 2px dashed var(--line);
  border-radius: 12px; background: var(--surface); text-align: center;
  transition: border-color .12s, background .12s;
}
.drop.hot { border-color: var(--accent); background: var(--surface-2); }
.drop h3 { font-size: 15px; margin-bottom: 5px; }
.drop p { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.drop .kinds { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.chip {
  font: 500 11px var(--sans); padding: 3px 9px; border-radius: 99px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2);
}
.drop.compact { padding: 13px 18px; display: flex; align-items: center;
  gap: 14px; text-align: left; margin: 14px 0; }
.drop.compact h3 { font-size: 13.5px; margin: 0; }
.drop.compact p { margin: 0; font-size: 12px; }
.drop.compact .kinds { margin: 0 0 0 auto; }

/* ---------- tabs ---------- */
nav.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--line);
  margin: 4px 0 18px; overflow-x: auto;
}
nav.tabs button {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 9px 14px; font: 500 13.5px var(--sans); color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 650; }
nav.tabs .count { font: 500 11px var(--mono); color: var(--ink-3); margin-left: 5px; }

/* ---------- cards / grid ---------- */
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: 2fr 1fr; }
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g21, .g3 { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .g4, .g2 { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.card > h4 {
  padding: 11px 14px; border-bottom: 1px solid var(--line-2);
  font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2);
  display: flex; align-items: center; gap: 8px;
}
.card > h4 .sub { text-transform: none; letter-spacing: 0; font-weight: 400;
  color: var(--ink-3); margin-left: auto; font-size: 11.5px; }
.card .body { padding: 14px; }
.card .body.flush { padding: 0; }

/* KPI tile */
.kpi { padding: 14px 15px; }
.kpi u { display: block; text-decoration: none; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-3); margin-bottom: 6px; }
.kpi b { font: 650 26px/1.05 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .unit { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 4px; }
.kpi .note { margin-top: 6px; font-size: 11.5px; color: var(--ink-2); }

/* ---------- tables ---------- */
.tw { overflow: auto; max-height: 72vh; }
table.dt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.dt th, table.dt td {
  padding: 6px 9px; text-align: left; border-bottom: 1px solid var(--line-2);
  white-space: nowrap;
}
table.dt thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2);
  font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-2); border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
}
table.dt thead th.no-sort { cursor: default; }
table.dt thead th .ar { color: var(--accent); margin-left: 3px; }
table.dt tbody tr:hover { background: var(--surface-2); }
table.dt td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.dt td.wrap { white-space: normal; min-width: 180px; max-width: 340px; }
table.dt tr.group td { background: var(--surface-3); font-weight: 650; }
table.dt tr.tot td { background: var(--surface-2); font-weight: 650; border-top: 2px solid var(--line); }
table.dt td.dim { color: var(--ink-3); }

.tag { font: 600 10.5px var(--sans); padding: 2px 6px; border-radius: 4px;
  background: var(--surface-3); color: var(--ink-2); letter-spacing: .03em; }
.tag.CSC { background: color-mix(in srgb, var(--csc) 18%, transparent); color: var(--csc); }
.tag.NWX { background: color-mix(in srgb, var(--nwx) 18%, transparent); color: var(--nwx); }
.tag.CCS { background: color-mix(in srgb, var(--ccs) 22%, transparent); color: var(--ccs); }
.tag.SKS { background: color-mix(in srgb, var(--sks) 20%, transparent); color: var(--sks); }
.tag.cancel { background: var(--neg-bg); color: var(--neg); }
.tag.active { background: var(--pos-bg); color: var(--pos); }
.tag.TS { background: var(--warn-bg); color: var(--warn); }

.pos { color: var(--pos); } .neg { color: var(--neg); } .warnc { color: var(--warn); }

/* utilisation bar */
.ubar { position: relative; height: 16px; min-width: 96px; background: var(--surface-3);
  border-radius: 3px; overflow: hidden; }
.ubar i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--pos); }
.ubar.hi i { background: var(--warn); }
.ubar.over i { background: var(--neg); }
.ubar em { position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 10.5px var(--mono); font-style: normal; color: var(--ink);
  text-shadow: 0 0 3px var(--surface); }

/* ---------- chart ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .gl { stroke: var(--line-2); stroke-width: 1; }
.chart text { fill: var(--ink-2); font: 10px var(--sans); }
.chart text.vlab { fill: var(--ink-3); font: 9.5px var(--mono); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 14px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }

/* ---------- filters ---------- */
.filters { display: flex; gap: 9px; flex-wrap: wrap; align-items: center;
  padding: 11px 14px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); margin-bottom: 14px; box-shadow: var(--shadow); }
.filters label { font-size: 11.5px; color: var(--ink-2); display: flex;
  align-items: center; gap: 5px; }
.filters select, .filters input {
  font: 13px var(--sans); padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--surface); color: var(--ink);
}
.filters input[type="search"] { min-width: 220px; }
.filters .sp { flex: 1; }

/* ---------- log / alerts ---------- */
.alert { display: flex; gap: 9px; padding: 8px 12px; border-bottom: 1px solid var(--line-2);
  font-size: 12.5px; align-items: flex-start; }
.alert:last-child { border-bottom: 0; }
.alert .lv { flex: none; font: 600 10px var(--sans); text-transform: uppercase;

<script id="tool-js">
/* ===== src/zip.js ===== */
/* ============================================================================
   zip.js — minimal ZIP reader/writer, no dependencies.
   Reading uses the browser-native DecompressionStream('deflate-raw').
   Writing uses STORE (no compression) — Excel opens these without complaint.
   ========================================================================= */
(function (global) {
  'use strict';

  const te = new TextEncoder();
  const td = new TextDecoder('utf-8');

  /* ---- CRC32 -------------------------------------------------------- */
  let CRC_TABLE = null;
  function crcTable() {
    if (CRC_TABLE) return CRC_TABLE;
    CRC_TABLE = new Int32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRC_TABLE[n] = c;
    }
    return CRC_TABLE;
  }
  function crc32(buf) {
    const t = crcTable();
    let c = -1;
    for (let i = 0; i < buf.length; i++) c = (c >>> 8) ^ t[(c ^ buf[i]) & 0xff];
    return (c ^ -1) >>> 0;
  }

  /* ---- inflate (native) --------------------------------------------- */
  const HAS_DS = typeof global.DecompressionStream === 'function';

  async function inflateRaw(bytes) {
    if (!HAS_DS) {
      throw new Error(
        'This browser cannot decompress .xlsx files (DecompressionStream is unavailable). ' +
        'Please open this file in Microsoft Edge, Google Chrome, or Firefox 113+.'
      );
    }
    const ds = new global.DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter();
    w.write(bytes);
    w.close();
    const chunks = [];
    const r = ds.readable.getReader();
    let total = 0;
    for (;;) {
      const { done, value } = await r.read();
      if (done) break;
      chunks.push(value);
      total += value.length;
    }
    const out = new Uint8Array(total);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }

  /* ---- read --------------------------------------------------------- */
  /**
   * Read a ZIP archive.
   * @param {ArrayBuffer|Uint8Array} data
   * @returns {Promise<Map<string, Uint8Array>>} path -> bytes
   */
  async function readZip(data) {
    const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    // Locate End Of Central Directory (scan backwards; comment may follow).
    let eocd = -1;
    const floor = Math.max(0, u8.length - 66000);
    for (let i = u8.length - 22; i >= floor; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Not a valid .xlsx/.zip file (no central directory found).');

    let count = dv.getUint16(eocd + 10, true);
    let cdOff = dv.getUint32(eocd + 16, true);

    // ZIP64 fallback when the 32-bit fields are saturated.
    if (cdOff === 0xffffffff || count === 0xffff) {
      for (let i = eocd - 20; i >= 0; i--) {
        if (dv.getUint32(i, true) === 0x07064b50) {
          const z64 = Number(dv.getBigUint64(i + 8, true));
          if (dv.getUint32(z64, true) === 0x06064b50) {
            count = Number(dv.getBigUint64(z64 + 32, true));
            cdOff = Number(dv.getBigUint64(z64 + 48, true));
          }
          break;
        }
      }
    }

    const files = new Map();
    let p = cdOff;
    for (let n = 0; n < count && p + 46 <= u8.length; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csizeRaw = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const cmtLen = dv.getUint16(p + 32, true);
      let lho = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nameLen));

      // ZIP64 extra field for oversized offsets.
      let csize = csizeRaw;
      if (lho === 0xffffffff || csizeRaw === 0xffffffff) {
        let e = p + 46 + nameLen;
        const end = e + extraLen;
        while (e + 4 <= end) {
          const hid = dv.getUint16(e, true);
          const hsz = dv.getUint16(e + 2, true);
          if (hid === 0x0001) {
            let q = e + 4;
            if (dv.getUint32(p + 24, true) === 0xffffffff) q += 8;   // uncompressed
            if (csizeRaw === 0xffffffff) { csize = Number(dv.getBigUint64(q, true)); q += 8; }
            if (lho === 0xffffffff) lho = Number(dv.getBigUint64(q, true));
            break;
          }
          e += 4 + hsz;
        }
      }

      // Read the local file header to find where the payload actually starts.
      if (dv.getUint32(lho, true) === 0x04034b50) {
        const lNameLen = dv.getUint16(lho + 26, true);
        const lExtraLen = dv.getUint16(lho + 28, true);
        const start = lho + 30 + lNameLen + lExtraLen;
        const raw = u8.subarray(start, start + csize);
        files.set(name, method === 0 ? raw : await inflateRaw(raw));
      }
      p += 46 + nameLen + extraLen + cmtLen;
    }
    return files;
  }

  /* ---- write (STORE) ------------------------------------------------ */
  /**
   * Build a ZIP archive with stored (uncompressed) entries.
   * @param {Array<{name:string, data:string|Uint8Array}>} entries
   * @returns {Blob}
   */
  function writeZip(entries) {
    const items = entries.map((e) => {
      const bytes = typeof e.data === 'string' ? te.encode(e.data) : e.data;
      return { name: te.encode(e.name), bytes, crc: crc32(bytes) };
    });

    const locals = [];
    const centrals = [];
    let offset = 0;

    // DOS timestamp — fixed value keeps output byte-stable across runs.
    const dosTime = ((12 & 0x1f) << 11) | ((0 & 0x3f) << 5) | 0;
    const dosDate = (((2026 - 1980) & 0x7f) << 9) | ((1 & 0x0f) << 5) | 1;

    for (const it of items) {
      const lh = new Uint8Array(30 + it.name.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);          // version needed
      lv.setUint16(6, 0x0800, true);      // UTF-8 filename flag
      lv.setUint16(8, 0, true);           // method = store
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, it.crc, true);
      lv.setUint32(18, it.bytes.length, true);
      lv.setUint32(22, it.bytes.length, true);
      lv.setUint16(26, it.name.length, true);
      lv.setUint16(28, 0, true);
      lh.set(it.name, 30);
      locals.push(lh, it.bytes);

      const ch = new Uint8Array(46 + it.name.length);
      const cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, it.crc, true);
      cv.setUint32(20, it.bytes.length, true);
      cv.setUint32(24, it.bytes.length, true);
      cv.setUint16(28, it.name.length, true);
      cv.setUint32(42, offset, true);
      ch.set(it.name, 46);
      centrals.push(ch);

      offset += lh.length + it.bytes.length;
    }

    const cdSize = centrals.reduce((a, c) => a + c.length, 0);
    const eo = new Uint8Array(22);
    const ev = new DataView(eo.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, items.length, true);
    ev.setUint16(10, items.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...locals, ...centrals, eo], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
  }

  global.FZip = { readZip, writeZip, crc32, hasNativeInflate: HAS_DS };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== src/xlsx-read.js ===== */
/* ============================================================================
   xlsx-read.js — read .xlsx into plain JS grids. Depends on FZip.
   Output shape:
     { sheets: [ { name, index, nrows, ncols, cells, merges } ], byName: {} }
   `cells` is a 1-based 2-D array: cells[row][col] = {v, t, f} | undefined
     v : value  (number | string | boolean | Date | null)
     t : 'n' | 's' | 'b' | 'd' | 'e'
     f : formula source without '=' (when present)
   ========================================================================= */
(function (global) {
  'use strict';

  const td = new TextDecoder('utf-8');
  const parser = new DOMParser();

  function xml(bytes) {
    const doc = parser.parseFromString(td.decode(bytes), 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      throw new Error('Malformed XML inside the workbook.');
    }
    return doc;
  }

  /* A1 -> {r, c} (both 1-based) */
  function refToRC(ref) {
    let c = 0, i = 0;
    while (i < ref.length) {
      const ch = ref.charCodeAt(i);
      if (ch < 65 || ch > 90) break;
      c = c * 26 + (ch - 64);
      i++;
    }
    return { c, r: parseInt(ref.slice(i), 10) || 0 };
  }

  function colLetter(n) {
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = (n - 1 - m) / 26;
    }
    return s;
  }

  /* Excel serial -> Date (UTC-based, 1900 system incl. the historical leap bug) */
  function serialToDate(n) {
    if (typeof n !== 'number' || !isFinite(n)) return null;
    let days = Math.floor(n);
    const frac = n - days;
    if (days > 60) days -= 1;              // skip the fictitious 1900-02-29
    const ms = Date.UTC(1899, 11, 31) + days * 86400000 + Math.round(frac * 86400000);
    return new Date(ms);
  }

  const BUILTIN_DATE_FMT = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 27, 30, 36, 45, 46, 47, 50, 57]);

  function looksLikeDateFormat(code) {
    if (!code) return false;
    // Strip quoted literals, escapes, colours and locale hints before sniffing.
    const s = code.replace(/"[^"]*"/g, '').replace(/\\./g, '').replace(/\[[^\]]*\]/g, '');
    return /[ymdhs]/i.test(s) && !/^(general)$/i.test(s.trim());
  }

  function parseStyles(files) {
    const dateXf = new Set();
    const bytes = files.get('xl/styles.xml');
    if (!bytes) return dateXf;
    let doc;
    try { doc = xml(bytes); } catch { return dateXf; }

    const custom = new Map();
    for (const n of doc.getElementsByTagName('numFmt')) {
      custom.set(parseInt(n.getAttribute('numFmtId'), 10), n.getAttribute('formatCode') || '');
    }
    const cellXfs = doc.getElementsByTagName('cellXfs')[0];
    if (!cellXfs) return dateXf;
    const xfs = cellXfs.getElementsByTagName('xf');
    for (let i = 0; i < xfs.length; i++) {
      const id = parseInt(xfs[i].getAttribute('numFmtId') || '0', 10);
      if (BUILTIN_DATE_FMT.has(id) || looksLikeDateFormat(custom.get(id))) dateXf.add(i);
    }
    return dateXf;
  }

  function parseSharedStrings(files) {
    const out = [];
    const bytes = files.get('xl/sharedStrings.xml');
    if (!bytes) return out;
    const doc = xml(bytes);
    for (const si of doc.getElementsByTagName('si')) {
      // Concatenate every <t>, skipping ruby/phonetic annotations.
      let s = '';
      for (const t of si.getElementsByTagName('t')) {
        const pn = t.parentNode && t.parentNode.nodeName;
        if (pn === 'rPh' || pn === 'phoneticPr') continue;
        s += t.textContent;
      }
      out.push(s);
    }
    return out;
  }

  function sheetTargets(files) {
    /* name -> zip path, in workbook order */
    const wbBytes = files.get('xl/workbook.xml');
    if (!wbBytes) throw new Error('Not a valid .xlsx workbook (xl/workbook.xml missing).');
    const rels = new Map();
    const relBytes = files.get('xl/_rels/workbook.xml.rels');
    if (relBytes) {
      for (const r of xml(relBytes).getElementsByTagName('Relationship')) {
        rels.set(r.getAttribute('Id'), r.getAttribute('Target'));
      }
    }
    const out = [];
    for (const sh of xml(wbBytes).getElementsByTagName('sheet')) {
      const name = sh.getAttribute('name');
      const state = sh.getAttribute('state') || 'visible';
      const rid =
        sh.getAttribute('r:id') ||
        sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels.get(rid) || '';
      target = target.replace(/^\/xl\//, '').replace(/^\//, '').replace(/^xl\//, '');
      let path = 'xl/' + target;
      if (!files.has(path)) {
        // Fall back to positional guess when relationships are unusual.
        const guess = `xl/worksheets/sheet${out.length + 1}.xml`;
        if (files.has(guess)) path = guess;
      }
      out.push({ name, state, path });
    }
    return out;
  }

  function parseSheet(bytes, sst, dateXf) {
    const doc = xml(bytes);
    const cells = [];
    let nrows = 0, ncols = 0;

    for (const row of doc.getElementsByTagName('row')) {
      const rAttr = parseInt(row.getAttribute('r') || '0', 10);
      let rIdx = rAttr;
      const cs = row.getElementsByTagName('c');
      let autoCol = 0;
      for (let i = 0; i < cs.length; i++) {
        const c = cs[i];
        const ref = c.getAttribute('r');
        let rc;
        if (ref) rc = refToRC(ref);
        else rc = { r: rIdx || 0, c: ++autoCol };
        if (!rc.r) rc.r = rIdx;
        autoCol = rc.c;
        rIdx = rc.r;

        const t = c.getAttribute('t') || 'n';
        const sIdx = parseInt(c.getAttribute('s') || '-1', 10);
        const fEl = c.getElementsByTagName('f')[0];
        const vEl = c.getElementsByTagName('v')[0];

        let value = null, type = 'n';
        if (t === 's') {
          const k = vEl ? parseInt(vEl.textContent, 10) : -1;
          value = sst[k] != null ? sst[k] : null;
          type = 's';
        } else if (t === 'inlineStr') {
          const is = c.getElementsByTagName('is')[0];
          value = is ? Array.from(is.getElementsByTagName('t')).map((x) => x.textContent).join('') : null;

      for (let c = 1; c <= sh.ncols; c++) {

        const f = fieldFor(cell.v);

    const C = Math.min(sh.ncols, maxCol || 40);
    for (let r = 1; r <= R; r++) {
      const row = sh.cells[r];
      if (!row) continue;
      for (let c = 1; c <= C; c++) {
        const cell = row[c];
        if (cell && typeof cell.v === 'string' && cell.v.trim()) {

    if (/DF CONTRACT/.test(txt) && /RATE\s*:/.test(txt)) return 'dfContract';
    if (/VSL\/VOY/.test(txt) && /\bWK\b/.test(txt)) return 'schedule';
    if (/(NORTHBOUND|SOUTHBOUND)/.test(txt) && /VESSEL\s*\/\s*VOY|BSA/.test(txt + ' ' + nm)) return 'bsa';
    if (/\bBSA\b/.test(nm)) return 'bsa';

      if (hdr.map.leg1Vessel !== undefined || hdr.map.leg2Vessel !== undefined) return 'masterForecast';
      if (hdr.map.pickupTerminal !== undefined || hdr.map.cancelDate !== undefined ||
          hdr.map.special !== undefined || hdr.map.salesRep !== undefined) return 'bkSheet';

        rec.voyEtdRef = (ctx && ctx.etd) || '';
        rec.pod = n.canonPort(val(r, 'pod'));
        rec.fpod = n.canonPort(val(r, 'fpod')) || rec.pod;
        rec.dirTs = rec.fpod && rec.pod && rec.fpod !== rec.pod ? 'TS' : 'DIR';
        rec.leg2Vessel = ''; rec.leg2Voy = ''; rec.leg2Etd = '';
        rec.svc2 = '';
        rec.voyageRef = ctx && ctx.voyageKey;

      if (!rec.svc1 && rec.partySvc) rec.svc1 = rec.partySvc;

      /* measures ---------------------------------------------------- */
      const teuSheet = n.num(val(r, 'teu'));
      rec.teuCalc = n.computeTeu(rec);
      rec.teu = rec.teuCalc || teuSheet;
      rec.teuSheet = teuSheet;
      rec.vgmWt = n.num(val(r, 'vgmWt'));
      rec.ratePerBox = n.num(val(r, 'ratePerBox'));
      rec.lumpsum = n.num(val(r, 'lumpsum'));
      rec.wtPerTeu = rec.teu ? Math.round((rec.vgmWt / rec.teu) * 100) / 100 : 0;
      rec.boxes = n.boxCount(rec);
      rec.wk = rec.leg1Etd ? n.excelWeekNum(rec.leg1Etd) : n.num(val(r, 'leg1Wk'));
      rec.wk2 = rec.leg2Etd ? n.excelWeekNum(rec.leg2Etd) : n.num(val(r, 'leg2Wk'));
      rec.emptyRepo = n.isEmptyRepo(rec);

      /* Drop rows that carry no information at all ------------------ */
      const hasId = rec.blNo || rec.leg1Vessel || rec.customer || rec.bkParty;
      if (!hasId && !rec.teu && !rec.boxes) continue;
      if (!rec.teu && !rec.boxes && !rec.blNo) continue;

    const byParty = groupBy(active, (r) => r.bkParty || '(none)').sort((a, b) => b.teu - a.teu);
    const byCustomer = groupBy(active.filter((r) => r.customer), (r) => r.customer)
      .sort((a, b) => b.teu - a.teu);
    const byDirTs = groupBy(active, (r) => r.dirTs || 'DIR');
    const byClass = groupBy(active, (r) => cargoClass(r));

    /* Week × service matrix for the heat chart. */
    const weeks = byWeek.map((w) => w.key);
    const svcCodes = byService.map((s) => s.key);
    const matrix = {};
    for (const s of svcCodes) matrix[s] = {};
    for (const r of active) {
      const s = n.svcOf(r) || '(unknown)';
      if (!matrix[s]) matrix[s] = {};
      matrix[s][r.wk] = (matrix[s][r.wk] || 0) + n.num(r.teu);
    }

    /* Container mix. */
    const mix = n.BOX_FIELDS.map((f) => ({
      key: f.label,
      units: active.reduce((s, r) => s + n.num(r[f.key]), 0),
      teu: active.reduce((s, r) => s + n.num(r[f.key]) * f.teu, 0),
    })).filter((x) => x.units);

    /* ---- per-voyage ---------------------------------------------- */
    const voyMap = new Map();
    for (const r of all) {
      const k = r.voyKey;
      if (!k || k === '|') continue;
      if (!voyMap.has(k)) voyMap.set(k, []);
      voyMap.get(k).push(r);
    }
    /* Include voyages known only from schedules/BSA. */
    for (const k in st.voyages) if (!voyMap.has(k)) voyMap.set(k, []);

    const byVoyage = [];
    for (const [key, rows] of voyMap) {
      const meta = st.voyages[key] || {};
      const act = rows.filter((r) => r.status !== 'cancel');
      const a = round(act.reduce((x, r) => accum(x, r), blank()));
      const parts = key.split('|');
      const vessel = meta.vessel || parts[0] || '';
      const voy = meta.voy || parts[1] || '';
      const svc = meta.svc || (act[0] && n.svcOf(act[0])) || st.vesselSvc[vessel] ||
                  n.VESSEL_SVC_SEED[vessel] || '';
      const etd = meta.firstEtd || (act.map((r) => r.leg1Etd).filter(Boolean).sort()[0] || '');
      const bsaTeu = n.num(meta.bsaTeu);
      const bsaTon = n.num(meta.bsaTon);

      const rot = meta.rotation && meta.rotation.length
        ? meta.rotation
        : (n.SERVICES[svc] ? n.SERVICES[svc].rotation.map((p) => ({ port: p, etd: '', wk: 0 })) : []);
      const rob = robPlan(Object.assign({}, meta, { rotation: rot, bsaTeu, bsaTon }), act,
                          n.SERVICES[svc] ? n.SERVICES[svc].rotation : null);

      /* Economics — only what the data actually supports. */
      const dfBase = n.num(meta.df && meta.df.base);
      const dfExcess = n.num(meta.df && meta.df.excess);
      const selling = a.revenue;
      const slotPerTeu = a.teu ? Math.round((dfBase / a.teu) * 100) / 100 : 0;
      const profit = dfBase ? Math.round((selling - dfBase - dfExcess) * 100) / 100 : null;

      byVoyage.push({
        key, vessel, voy, svc, etd,
        wk: etd ? n.excelWeekNum(etd) : 0,
        rows: a.rows, cancelRows: rows.length - act.length,
        teu: a.teu, boxes: a.boxes, wt: a.wt,
        u20: a.u20, u40: a.u40,
        bsaTeu, bsaTon,
        vesselTeu: meta.vesselTeu || null, vesselTon: meta.vesselTon || null,
        peakTeu: rob.peakTeu, peakTon: rob.peakTon,
        remainTeu: bsaTeu ? Math.round((bsaTeu - rob.peakTeu) * 100) / 100 : null,
        remainTon: bsaTon ? Math.round((bsaTon - rob.peakTon) * 100) / 100 : null,
        utilPct: bsaTeu ? Math.round((rob.peakTeu / bsaTeu) * 1000) / 10 : null,
        dfBase, dfExcess, selling, slotPerTeu, profit,
        winSabis: meta.winSabis || '', docClosing: meta.docClosing || '',
        cargoClosing: meta.cargoClosing || '', scheduleRemark: meta.scheduleRemark || '',
        rob,
      });
    }
    byVoyage.sort((a, b) => (a.etd || 'zzzz').localeCompare(b.etd || 'zzzz') ||
                            a.vessel.localeCompare(b.vessel));

    /* Alerts worth surfacing. */
    const alerts = [];
    for (const v of byVoyage) {
      if (v.bsaTeu && v.peakTeu > v.bsaTeu) {
        alerts.push({
          level: 'over', text: `${v.vessel} ${v.voy} peaks at ${v.peakTeu} TEU against a ${v.bsaTeu} TEU BSA ` +
            `(+${Math.round((v.peakTeu - v.bsaTeu) * 10) / 10})`,
        });
      }
      if (v.bsaTon && v.peakTon > v.bsaTon) {
        alerts.push({
          level: 'over', text: `${v.vessel} ${v.voy} peaks at ${Math.round(v.peakTon)} T against a ${v.bsaTon} T limit`,
        });
      }
    }
    for (const r of active) {
      if (r.teuSheet && Math.abs(r.teuSheet - r.teu) > 0.001) {
        alerts.push({
          level: 'warn',
          text: `TEU mismatch on ${r.blNo || '(no B/L)'} — source sheet says ${r.teuSheet}, boxes compute to ${r.teu}`,
        });
      }
    }
    /* Two sources describing the same booking differently — worth a human look. */
    for (const c of (st.conflicts || []).slice(0, 40)) {
      alerts.push({
        level: 'warn',
        text: `${c.blNo || '(no B/L)'} — ${c.field} differs between sources: kept "${c.kept}" ` +
              `(${c.keptFrom}), ignored "${c.dropped}" (${c.droppedFrom})`,
      });
    }

    /* Services taken from the voyage schedule in place of a mistyped header.
       Grouped so one bad sheet produces one line, not thirty. */
    const svcFix = new Map();
    for (const c of (st.svcCorrections || [])) {
      const k = c.voy + '~' + c.from + '~' + c.to + '~' + c.src;
      const e = svcFix.get(k) || Object.assign({ count: 0 }, c);
      e.count += 1;
      svcFix.set(k, e);
    }
    for (const e of svcFix.values()) {
      alerts.push({
        level: 'warn',
        text: `${e.vessel} ${e.voyNo}: sheet header says service ${e.from}, but this voyage's ` +
              `schedule is ${e.to}. Used ${e.to} for ${e.count} booking(s) — fix ${e.src}`,
      });
    }

    /* A vessel on a loop it does not normally run, where no schedule settles it. */
    const svcMismatch = new Map();
    for (const r of active) {
      if (!r.svc1 || !r.leg1Vessel) continue;
      const meta = st.voyages[r.voyKey];
      if (meta && meta.svcRank === 2) continue;      /* already schedule-backed */
      const expected = n.VESSEL_SVC_SEED[r.leg1Vessel];
      if (!expected || expected === r.svc1) continue;
      const k = r.voyKey + '~' + r.svc1 + '~' + expected;
      const e = svcMismatch.get(k) ||
        { vessel: r.leg1Vessel, voy: r.leg1Voy, got: r.svc1, expected, count: 0 };
      e.count += 1;
      svcMismatch.set(k, e);
    }
    for (const e of svcMismatch.values()) {
      alerts.push({
        level: 'warn',
        text: `${e.vessel} ${e.voy} is marked service ${e.got} on ${e.count} booking(s), ` +
              `but ${e.vessel} normally runs ${e.expected} — no schedule on file to settle it`,
      });
    }

    const noSvc = active.filter((r) => !n.svcOf(r)).length;
    if (noSvc) alerts.push({ level: 'info', text: `${noSvc} row(s) have no service assigned` });
    const noEtd = active.filter((r) => !r.leg1Etd).length;
    if (noEtd) alerts.push({ level: 'info', text: `${noEtd} row(s) have no 1st-leg ETD` });
    const unknownPorts = new Set();
    for (const r of active) {
      for (const p of [r.pol, r.pod, r.fpod, r.ts]) {
        if (p && !n.PORTS[p]) unknownPorts.add(p);
      }
    }
    if (unknownPorts.size) {
      alerts.push({ level: 'info', text: 'Unrecognised port codes: ' + Array.from(unknownPorts).join(', ') });
    }

    return {
      totals, byService, byWeek, byLane, byPol, byPod, byParty, byCustomer,
      byDirTs, byClass, byVoyage, matrix, weeks, svcCodes, mix,
      alerts: alerts.slice(0, 200),
      active, cancelled, all,
    };
  }

  global.FAgg = { build, robPlan, cargoClass, dischargePort, teu20, teu40, groupBy };
})(typeof window !== 'undefined' ? window : globalThis);

(function (global) {
  'use strict';

  const W = () => global.FXlsxWrite;

  function H(labels) { return labels.map((l) => ({ v: l, s: 'hdr' })); }
  function D(v) {
    const d = N().toDate(v);

    'POL', 'T/S', 'F.POD',
    "20'DV", "20'MT", "40'HC", "40'MT", "20'FR", "40'FR", 'Void',
    'TEU', 'VGM Wt.', 'Wt./TEU', 'Item', 'Rate/Box', 'Lumpsum Rate',
    'Status', 'Source File', 'Source Sheet', 'Src Row', 'First Seen', 'Last Seen',

    7, 7, 7, 7, 7, 7, 6, 7, 10, 9, 22, 10, 12, 9, 26, 20, 8, 18, 18];

  function masterRow(r) {
    const n = N();
    return [
      r.remark, r.customer, r.bkParty, r.blNo,
      r.leg1Vessel, r.leg1Voy, D(r.leg1Etd), int(r.wk),
      r.leg2Vessel, r.leg2Voy, D(r.leg2Etd), int(r.wk2),
      r.dirTs, N().svcOf(r), r.svc2,
      r.pol, r.ts, r.fpod,
      int(r.c20dv), int(r.c20mt), int(r.c40hc), int(r.c40mt), int(r.c20fr), int(r.c40fr), int(r.cvoid),
      num(r.teu), num(r.vgmWt), num(r.wtPerTeu), r.item, num(r.ratePerBox), num(r.lumpsum),
      r.status, r.srcFile, r.srcSheet, int(r.srcRow),
      D(r.firstSeen && r.firstSeen.slice(0, 10)), D(r.lastSeen && r.lastSeen.slice(0, 10)),
    ];
  }

  function totalsRow(records, offset, label) {
    const n = N();
    const row = new Array(MASTER_COLS.length).fill('');
    row[0] = { v: label, s: 'bold' };
    const boxKeys = ['c20dv', 'c20mt', 'c40hc', 'c40mt', 'c20fr', 'c40fr', 'cvoid'];
    boxKeys.forEach((k, i) => {
      const s = records.reduce((a, r) => a + n.num(r[k]), 0);

    row[offset + 7] = { v: Math.round(records.reduce((a, r) => a + n.num(r.teu), 0) * 100) / 100, s: 'money' };
    row[offset + 8] = { v: Math.round(records.reduce((a, r) => a + n.num(r.vgmWt), 0) * 100) / 100, s: 'money' };
    row[offset + 13] = { v: Math.round(records.reduce((a, r) => a + n.num(r.lumpsum), 0) * 100) / 100, s: 'money' };
    return row;
  }

  /* ------------------------------------------------------------------ *
   * 2. Per-service sheets in the agency layout
   * ------------------------------------------------------------------ */
  const SVC_COLS = [
    'Remark', 'Agency', 'B/L NO', 'Vessel', 'Voy', 'WK', 'ETD', 'POL', 'POD', 'F.POD',
    "20'DV", "20'MT", "40'HC", "40'MT", "20'FR", "40'FR", 'Void',
    'TEU', 'VGM Wt.', 'Wt./TEU', 'Item', 'Rate/Box', 'Lumpsum Rate',
  ];
  const SVC_W = [24, 14, 24, 20, 9, 6, 11, 9, 9, 9, 7, 7, 7, 7, 7, 7, 6, 7, 10, 9, 22, 10, 12];

      r.pol, r.pod, r.fpod,
      int(r.c20dv), int(r.c20mt), int(r.c40hc), int(r.c40mt), int(r.c20fr), int(r.c40fr), int(r.cvoid),
      num(r.teu), num(r.vgmWt), num(r.wtPerTeu), r.item, num(r.ratePerBox), num(r.lumpsum),
    ];

    sheets.push({

      agg.byService.map((s) => s.key).filter((k) => n.SERVICE_CODES.indexOf(k) < 0)
    );
    for (const svc of svcOrder) {
      const rows = active.filter((r) => (n.svcOf(r) || '(unknown)') === svc);
      if (!rows.length) continue;

        [{ v: `SVC NAME : ${svc}`, s: 'title' }, '', '', '',
         { v: `${rows.length} bookings`, s: 'bold' }, '',

          int(v.bsaTon),

      for (const c of agg.byCustomer) prows.push([c.key, int(c.rows), num(c.teu), int(c.boxes), num(c.wt), num(c.revenue)]);
    }
    sheets.push({ name: 'PARTY SUMMARY', rows: prows, cols: [34, 10, 9, 8, 11, 13].map((w) => ({ w })), freeze: 'B2' });

    /* --- CANCEL LIST --------------------------------------------- */
    if (agg.cancelled.length) {
      const crows = [
        [{ v: '** CANCEL LIST', s: 'title' }, '', '', { v: `${agg.cancelled.length} rows`, s: 'bold' }],
        [],
        H(MASTER_COLS),
      ];
      agg.cancelled
        .slice()
        .sort((a, b) => (a.leg1Etd || '').localeCompare(b.leg1Etd || ''))
        .forEach((r) => crows.push(masterRow(r)));
      sheets.push({
        name: 'CANCEL LIST', rows: crows, cols: MASTER_W.map((w) => ({ w })),
        freeze: 'E4', autofilter: true, autofilterRow: 3,
      });
    }

    /* --- CHANGE LOG ---------------------------------------------- */
    const glrows = [H(['When', 'Batch', 'Added', 'Updated', 'Unchanged', 'Cancelled', 'Total after', 'Files'])];
    for (const e of st.log) {
      glrows.push([
        e.ts.replace('T', ' ').slice(0, 19), e.label,
        int(e.added), int(e.updated), int(e.unchanged), int(e.cancelled), int(e.total),
        (e.files || []).join(', '),
      ]);
    }
    glrows.push([]);
    glrows.push(H(['When', 'Batch', 'Change', 'B/L NO', 'Voyage', 'TEU', 'Field', 'From', 'To']));
    for (const e of st.log) {
      for (const c of (e.changes || [])) {
        if (c.type === 'added') {
          glrows.push([e.ts.replace('T', ' ').slice(0, 19), e.label, 'added', c.blNo, c.voy, num(c.teu)]);
        } else {
          for (const d of (c.diff || [])) {
            glrows.push([e.ts.replace('T', ' ').slice(0, 19), e.label, 'updated', c.blNo, c.voy, num(c.teu),
              d.f, String(d.from == null ? '' : d.from), String(d.to == null ? '' : d.to)]);
          }
        }
      }
    }
    sheets.push({ name: 'CHANGE LOG', rows: glrows, cols: [20, 22, 10, 10, 11, 10, 12, 40, 16, 22, 22].map((w) => ({ w })), freeze: 'A2' });

    /* --- DF CONTRACTS -------------------------------------------- */
    if (st.df && st.df.length) {
      const drows = [H(['Provider', 'SVC', 'Period label', 'Period', 'Maiden VOY', 'Term',
        'Rate / TEU', 'Vol TEU', 'Wt Ton', 'Fixed Amount', 'Actual Slot / TEU', 'Surcharges', 'Source'])];
      for (const d of st.df) {
        const sur = Object.keys(d.surcharges || {})
          .map((k) => `${k} ${d.surcharges[k].rate}/${d.surcharges[k].unit}`).join('; ');
        drows.push([d.provider, d.svc, d.periodLabel, d.period, d.maidenVoy, d.term,
          num(d.ratePerTeu), int(d.volTeu), int(d.wtTon), num(d.fixedAmount),
          num(d.actualSlotPerTeu), sur, d.srcSheet]);
      }
      sheets.push({ name: 'DF CONTRACTS', rows: drows, cols: [10, 7, 16, 22, 40, 8, 11, 9, 9, 13, 15, 40, 26].map((w) => ({ w })), freeze: 'C2' });
    }

    /* --- DATA QUALITY -------------------------------------------- */
    const qrows = [
      [{ v: 'Farmkogls booking consolidation — data quality', s: 'title' }],
      [{ v: 'Generated', s: 'sub' }, stamp],
      [{ v: 'Source files', s: 'sub' }, (st.files || []).join(', ')],
      [{ v: 'Active bookings', s: 'sub' }, { v: agg.totals.rows, s: 'money' },
       { v: 'Active TEU', s: 'sub' }, { v: agg.totals.teu, s: 'money' }],
      [{ v: 'Cancelled', s: 'sub' }, { v: agg.totals.cancelledRows, s: 'money' },
       { v: 'Cancelled TEU', s: 'sub' }, { v: agg.totals.cancelledTeu, s: 'money' }],
      [{ v: 'Empty-repo TEU', s: 'sub' }, { v: agg.totals.emptyRepoTeu, s: 'money' }],
      [],
      H(['Level', 'Finding']),
    ];
    for (const a of agg.alerts) {
      qrows.push([{ v: a.level, s: a.level === 'over' ? 'warn' : 'def' }, { v: a.text, s: 'wrap' }]);
    }
    if (!agg.alerts.length) qrows.push([{ v: 'ok', s: 'good' }, 'No issues detected.']);
    qrows.push([]);
    qrows.push(H(['Container type', 'Units', 'TEU']));
    for (const m of agg.mix) qrows.push([m.key, int(m.units), num(m.teu)]);

    /* Where two files described the same booking differently. */
    if (st.conflicts && st.conflicts.length) {
      qrows.push([]);
      qrows.push([{ v: 'SOURCE DISAGREEMENTS — same booking, different values', s: 'title' }]);
      qrows.push(H(['B/L NO', 'Voyage', 'Field', 'Kept', 'Kept from', 'Ignored', 'Ignored from']));
      for (const c of st.conflicts.slice(0, 300)) {
        qrows.push([c.blNo, c.voy, c.field, c.kept, c.keptFrom, c.dropped, c.droppedFrom]);
      }
    }
    sheets.push({
      name: 'DATA QUALITY', rows: qrows,
      cols: [26, 90, 16, 24, 30, 24, 30].map((w) => ({ w })),
    });

    return W().build(sheets);
  }

  function fileName(prefix) {
    const d = new Date();
    const p = (x) => String(x).padStart(2, '0');
    return `${prefix || 'FES_BK_FCST_CONSOLIDATED'}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`;
  }

  global.FExport = { buildWorkbook, fileName, MASTER_COLS, SVC_COLS };

/* ============================================================================
   ui.js — Farmkogls Booking Console application shell.
   ========================================================================= */
(function (global) {
  'use strict';

  const N = () => global.FNorm;
  const LS_KEY = 'farmkogls.console.store.v3';

  const App = {
    store: null,
    agg: null,
    tab: 'propagate',
    /* Raw bytes kept so the register file can be edited in place, not rebuilt. */
    prop: { agency: null, target: null, report: null, blob: null, running: false },
    filters: { svc: '', wkFrom: '', wkTo: '', voy: '', status: 'active', q: '', party: '', pol: '', pod: '' },
    sort: { bookings: { col: 'leg1Etd', dir: 1 }, voyages: { col: 'etd', dir: 1 } },
    busy: false,
    exportFiltered: false,
  };

  /* ------------------------------------------------------------------ *
   * small helpers
   * ------------------------------------------------------------------ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function fmt(v, dp) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    if (!isFinite(n)) return esc(v);
    return n.toLocaleString('en-US', {
      minimumFractionDigits: dp || 0,
      maximumFractionDigits: dp === undefined ? (Number.isInteger(n) ? 0 : 1) : dp,
    });
  }
  function svcTag(s) { return s ? `<span class="tag ${esc(s)}">${esc(s)}</span>` : '<span class="tag">—</span>'; }
  function svcColour(s) {
    const m = { CSC: 'var(--csc)', NWX: 'var(--nwx)', CCS: 'var(--ccs)', SKS: 'var(--sks)' };
    return m[s] || 'var(--ink-3)';
  }

  function toast(title, msg, kind) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = `<b>${esc(title)}</b>${msg ? `<span>${esc(msg)}</span>` : ''}`;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, kind === 'bad' ? 9000 : 4200);
    setTimeout(() => el.remove(), kind === 'bad' ? 9500 : 4700);
  }

  /**
   * Hand a generated file to the user.
   * On the hosted build the frame cannot download directly — the viewer has to
   * confirm a save, and .xlsx is not an allowed type there. Say so plainly and
   * point at the downloadable tool rather than failing silently.
   */
  async function download(blob, name) {
    const cd = global.claude && global.claude.downloads;
    if (cd) {
      try {
        await cd.save({ filename: name, data: blob });
        return true;
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') return false;
        if (code === 'rejected_extension' || code === 'extension_not_enabled') {
          toast('이 화면에서는 엑셀 파일로 저장할 수 없습니다',
            '아래 “도구 내려받기”로 받은 파일을 PC에서 열면 엑셀 저장까지 됩니다.', 'bad');
          return false;
        }
        if (code === 'too_large') {
          toast('파일이 너무 큽니다', '필터를 좁혀 내보내거나, 도구를 받아 PC에서 실행하세요.', 'bad');
          return false;
        }
        /* anything else: fall through and try the ordinary way */
      }
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) {
      toast('파일을 저장하지 못했습니다', String((e && e.message) || e), 'bad');
      return false;
    }
  }

  /* ------------------------------------------------------------------ *
   * persistence
   * ------------------------------------------------------------------ */
  let warnedSize = false;
  function save() {
    if (!App.canPersist) return;
    let json;
    try { json = global.FMerge.toJSON(App.store); } catch (e) { return; }
    try {
      localStorage.setItem(LS_KEY, json);
      /* Browsers cap local storage around 5 MB. Warn before we hit the wall. */
      if (!warnedSize && json.length > 3.6e6) {
        warnedSize = true;
        toast('등록부가 커지고 있습니다',
          '약 5 MB 중 ' + (Math.round(json.length / 1024 / 1024 * 10) / 10) + ' MB를 썼습니다. ' +
          '프로젝트 파일로 저장하고 지난 시즌은 정리해 주세요.', 'bad');
      }
    } catch (e) {
      App.canPersist = false;
      toast('이 브라우저에는 등록부를 보관할 수 없습니다',
        '저장 공간이 가득 찼거나 막혀 있어 새로고침하면 사라집니다. ' +
        '“프로젝트 저장”으로 파일을 받아 두세요.', 'bad');
    }
  }
  function load() {
    try {
      const t = localStorage.getItem(LS_KEY);
      if (!t) return null;
      return global.FMerge.fromJSON(t);
    } catch (e) { return null; }
  }

  /* ------------------------------------------------------------------ *
   * filtering
   * ------------------------------------------------------------------ */
  function filterFn() {
    const f = App.filters;
    const q = f.q.trim().toLowerCase();
    const wf = f.wkFrom === '' ? -Infinity : Number(f.wkFrom);
    const wt = f.wkTo === '' ? Infinity : Number(f.wkTo);
    return (r) => {
      if (f.status === 'active' && r.status === 'cancel') return false;
      if (f.status === 'cancel' && r.status !== 'cancel') return false;
      if (f.svc && (N().svcOf(r) || '') !== f.svc) return false;
      if (f.voy && r.voyKey !== f.voy) return false;
      if (f.party && r.bkParty !== f.party) return false;
      if (f.pol && r.pol !== f.pol) return false;
      if (f.pod && (r.fpod || r.pod) !== f.pod) return false;
      if (r.wk && (r.wk < wf || r.wk > wt)) return false;
      if (q) {
        const hay = [r.blNo, r.customer, r.bkParty, r.leg1Vessel, r.leg1Voy, r.leg2Vessel,
          r.item, r.remark, r.pol, r.pod, r.fpod, r.special, r.salesRep].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    };
  }

  function rebuild() {
    App.agg = global.FAgg.build(App.store);
    render();
  }

  /* ------------------------------------------------------------------ *
   * ingest
   * ------------------------------------------------------------------ */
  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter((f) => /\.(xlsx|xlsm|xltx)$/i.test(f.name));
    const json = Array.from(fileList).filter((f) => /\.json$/i.test(f.name));

    if (json.length) {
      for (const jf of json) {
        try {
          App.store = global.FMerge.fromJSON(await jf.text());
          save(); rebuild();
          toast('프로젝트를 불러왔습니다', `${jf.name} — 부킹 ${App.store.records.length}건`, 'good');
        } catch (e) { toast('프로젝트를 불러오지 못했습니다', jf.name + ': ' + e.message, 'bad'); }
      }
      if (!files.length) return;
    }
    if (!files.length) {
      toast('읽을 파일이 없습니다', '.xlsx 파일이나 저장해 둔 .json 프로젝트를 넣어 주세요.', 'bad');
      return;
    }

    App.busy = true; renderStatus();
    const prog = $('#prog');
    prog.hidden = false; prog.max = files.length; prog.value = 0;

    let recs = [], voy = [], bsa = [], df = [], rob = [];
    const names = [], report = [];

    for (const f of files) {
      try {
        const bytes = await f.arrayBuffer();
        const wb = await global.FXlsxRead.readWorkbook(bytes, f.name);

        /* Remember the two workbooks the in-place update needs.
           NB: this list is the workbook's SHEET names — keep it distinct from
           `names`, the list of ingested file names used for the batch label. */
        const sheetNames = wb.sheets.map((s) => s.name);
        if (sheetNames.indexOf(global.FProp.TARGET_SHEET) >= 0) {
          App.prop.target = { name: f.name, bytes, mtime: f.lastModified || 0 };
          App.prop.report = null; App.prop.blob = null;
        } else if (sheetNames.some((nm) => /FES\s+(CSC|NWX|CCS|SKS)\s+BK\s*FCST/i.test(nm))) {
          App.prop.agency = { name: f.name, bytes, mtime: f.lastModified || 0 };
          App.prop.report = null; App.prop.blob = null;
        }

        const res = global.FParse.parseWorkbook(wb);
        /* Stamp the file's own timestamp so a newer file wins a disagreement
           against an equally-trusted older one. */
        const mtime = f.lastModified || 0;
        res.records.forEach((r) => { r.srcMtime = mtime; });
        recs = recs.concat(res.records);
        voy = voy.concat(res.voyages);
        bsa = bsa.concat(res.bsa);
        df = df.concat(res.df);
        rob = rob.concat(res.rob);
        names.push(f.name);
        const kinds = {};
        res.sheets.forEach((s) => { kinds[s.kind] = (kinds[s.kind] || 0) + 1; });
        report.push({
          file: f.name, records: res.records.length, sheets: res.sheets.length,
          kinds, skipped: res.skipped,
        });
        if (!res.sheets.length) {
          toast('인식된 시트가 없습니다', f.name + ' — 아는 양식과 맞는 시트를 찾지 못했습니다.', 'bad');
        }
      } catch (e) {
        toast(f.name + ' 을(를) 읽지 못했습니다', e.message, 'bad');
        report.push({ file: f.name, error: e.message });
      }
      prog.value += 1;
    }

    /* ROB sheets contribute BSA caps at the lowest precedence. */
    const voyAll = voy.concat(rob.map((r) => ({
      srcFile: r.srcFile, srcSheet: r.srcSheet, key: r.key,
      vessel: r.vessel, voy: r.voy, bsaTeu: r.bsaTeu, bsaTon: r.bsaTon, bsaRank: 1,
    })));

    const entry = global.FMerge.ingest(App.store, recs, {
      label: names.length === 1 ? names[0] : `${names.length}개 파일`,
      files: names, voyages: voyAll, bsa, df,
    });
    App.lastReport = report;

    prog.hidden = true; App.busy = false;
    save(); rebuild();

    toast(names.length + '개 파일을 반영했습니다',
      `신규 ${entry.added} · 갱신 ${entry.updated} · 변화없음 ${entry.unchanged}` +
      (entry.dupsInBatch ? ` · 중복 ${entry.dupsInBatch}행 병합` : '') +
      ` → 누적 ${entry.total}건`, 'good');
  }

  /* ------------------------------------------------------------------ *
   * export
   * ------------------------------------------------------------------ */
  async function doExport() {
    if (!App.store.records.length) { toast('내보낼 내용이 없습니다', '먼저 파일을 넣어 주세요.', 'bad'); return; }

    try {
      const agg = App.exportFiltered ? global.FAgg.build(App.store, filterFn()) : global.FAgg.build(App.store);
      const blob = await global.FExport.buildWorkbook(App.store, agg);

      if (ok) {
        toast('통합 엑셀을 저장했습니다',
          `활성 부킹 ${agg.active.length}건 · ${fmt(agg.totals.teu, 1)} TEU · ` +
          `항차 ${agg.byVoyage.length}개`, 'good');
